[package]
name = "snake_game"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4.15", features = ["audio"] }
rand = "0.10.2"

# ── Dev profile: opt-level 2 so gameplay is smooth even without --release ─────
[profile.dev]
opt-level = 3        # fast enough for 50+ snakes while debugging
debug = true           # keep debug symbols

# Dependencies always compiled at full speed even in dev builds
[profile.dev.package."*"]
opt-level = 3

# ── Release profile: maximum throughput ───────────────────────────────────────
[profile.release]
opt-level = 3          # full optimisation
lto = "fat"            # link-time optimisation across all crates
codegen-units = 1      # single codegen unit → better inlining
panic = "abort"        # removes unwinding overhead
strip = "symbols"      # smaller binary, faster load
