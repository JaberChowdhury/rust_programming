[package]
name = "api_project"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
owo-colors = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
